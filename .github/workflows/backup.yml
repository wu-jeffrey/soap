name: Backup templates

# Nightly snapshot of the template library (Cloudflare D1) into templates.json,
# so the data stays versioned in git and is restorable if the database is ever lost.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch templates
        run: |
          curl -sf https://fm-templates-api.jeff-jiang-wu.workers.dev/templates -o /tmp/templates.raw
          python3 -m json.tool /tmp/templates.raw > templates.json
      - name: Commit if changed
        run: |
          git add templates.json
          if ! git diff --cached --quiet; then
            git config user.name "template-backup"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Backup: template library snapshot"
            git push
          fi
